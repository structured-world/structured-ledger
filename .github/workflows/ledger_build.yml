name: Ledger build

# Ledger's reusable build, the build Ledger deploys from, for every device in
# ledger_app.toml.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  build:
    name: Build for every device
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@db5fd3d8e4fe724ccc4617709c9e245976ee8280 # v1
    with:
      upload_app_binaries_artifact: structured_passkeys_binaries
      builder: ledger-app-builder
      # Pull requests also build the target branch and get a comment with the ELF section and
      # stack sizes per device against it. Not for pull requests from forks: their token is
      # read-only, and the reusable workflow puts the table only into that comment, so the
      # target branch builds would produce nothing anyone sees.
      build_comparison: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
