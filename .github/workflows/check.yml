name: Check

# The repository's gate script, the same one local runs use.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          # shellcheck pinned: rule codes change between releases, and the gate must judge the
          # same way here and on a workstation.
          tool: cargo-nextest,lychee,shellcheck@0.11.0
      - name: Gate
        run: scripts/check.sh
