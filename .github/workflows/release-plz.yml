name: Release-plz

# Keeps the release pull request (version bump and CHANGELOG entry from conventional commits)
# and, when it is merged, tags vX.Y.Z and creates the GitHub release. The release bot's token is
# used instead of GITHUB_TOKEN, because pull requests and releases created with GITHUB_TOKEN do
# not start the checks and the release-assets workflow.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-pr:
    name: Release pull request
    runs-on: ubuntu-latest
    if: github.repository_owner == 'structured-world'
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Release bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Release pull request
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release:
    name: Tag and GitHub release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'structured-world'
    # No concurrency group: GitHub replaces a pending job of a group with the next one, which
    # would drop the run of a merged release pull request when another push follows it. Parallel
    # runs are safe, since with release_always = false only the run of the release pull request's
    # merge commit releases.
    steps:
      - name: Release bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Tag and release
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
