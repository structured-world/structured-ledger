name: Ledger guidelines

# Ledger's guidelines enforcer, required for the Ledger catalog: manifest, icons,
# load parameters, README and SDK version.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  guidelines_enforcer:
    name: Ledger guidelines enforcer
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_guidelines_enforcer.yml@db5fd3d8e4fe724ccc4617709c9e245976ee8280 # v1
