[package]
name = "structured-passkeys-app"
description = "FIDO2 / passkey authenticator application for Ledger devices"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# `app_io_stack` runs the IO stack in the application, so the application can drive the FIDO HID
# interface itself, and `Comm::next_command_or_event` hands it the ticker events its transport
# clock needs; both come from this fork of the Ledger Rust SDK until the published crate has them.
# `sys` exposes the C SDK calls the application makes directly: the NBGL use cases its screens
# start without the SDK's blocking wait, and the device PIN check.
ledger_device_sdk = { git = "https://github.com/structured-world/ledger-device-rust-sdk", rev = "77f7711b998d55967478ce846006e03029db2ce0", features = ["io_new", "nano_nbgl", "app_io_stack", "sys"] }
structured-passkeys-ctap = { path = "../crates/ctap", default-features = false }
zeroize = { version = "1.9.0", default-features = false }

# Read by the SDK build script into the install parameters of the binary. Icon paths are
# relative to this directory.
[package.metadata.ledger]
name = "Structured Passkeys"
curve = ["secp256r1"]
# APPLICATION_FLAG_GLOBAL_PIN: built-in user verification has the operating system check the
# device PIN the user re-enters in the ceremony.
flags = "0x40"
path = ["5722689'/5262163'"]
nanosplus = { icon = "icons/key_14x14.png" }
nanox = { icon = "icons/key_14x14.png" }
stax = { icon = "icons/key_32x32.png" }
flex = { icon = "icons/key_40x40.png" }
apex_p = { icon = "icons/key_32x32.png" }

[lints]
workspace = true
